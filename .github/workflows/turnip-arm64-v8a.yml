name: Turnip arm64-v8a
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 0 0 1,15 * *
permissions:
  contents: read
jobs:
  build-turnip-arm64-v8a:
    strategy:
      fail-fast: false
      matrix:
        kmd: [kgsl, msm, virtio]
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build-android-aarch64-${{ matrix.kmd }}
      KMD: ${{ matrix.kmd }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build flex bison python3-pip python3-mako python3-packaging pkg-config patchelf zip file glslang-tools
          pip3 install --upgrade meson
          meson --version
          ninja --version
          ls "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep aarch64
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" --version
      - name: Generate Meson cross file
        run: |
          NDK_ROOT="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME}}"
          echo "NDK_ROOT=$NDK_ROOT"
          EMPTY_PKGCONFIG="$PWD/empty-pkgconfig"
          mkdir -p "$EMPTY_PKGCONFIG"
          printf "[constants]\nndk_path = '%s'\n\n[binaries]\nar = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nc = [ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang']\ncpp = [ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']\nc_ld = 'lld'\ncpp_ld = 'lld'\nstrip = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = ['/usr/bin/pkg-config']\n\n[properties]\npkg_config_libdir = '%s'\n\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'armv8'\nendian = 'little'\n" "$NDK_ROOT" "$EMPTY_PKGCONFIG" > android-aarch64
          cat android-aarch64
      - name: Meson setup
        run: |
          meson setup "$BUILD_DIR" \
            --cross-file android-aarch64 \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dzstd=disabled \
            -Dspirv-tools=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=$KMD \
            -Dallow-fallback-for=libdrm \
            -Dlibarchive:openssl=disabled \
            -Dlibarchive:zlib=disabled \
            -Dlibarchive:bz2lib=disabled \
            -Dlibarchive:libb2=disabled \
            -Dlibarchive:iconv=disabled \
            -Dlibarchive:lz4=disabled \
            -Dlibarchive:zstd=disabled \
            -Dlibarchive:lzma=disabled \
            -Dlibarchive:lzo2=disabled \
            -Dlibarchive:xml2=disabled \
            -Dlibarchive:expat=disabled
      - name: Compile
        run: |
          meson compile -C "$BUILD_DIR"
      - name: Verify artifacts
        run: |
          ls -lh "$BUILD_DIR/src/freedreno/vulkan/"
          file "$BUILD_DIR/src/freedreno/vulkan/"*.so
          ls -lh "$BUILD_DIR/src/freedreno/vulkan/"*.json || true
      - name: Package
        run: |
          mkdir -p dist/turnip-arm64-v8a-$KMD
          cp "$BUILD_DIR/src/freedreno/vulkan/"*.so dist/turnip-arm64-v8a-$KMD/
          cp "$BUILD_DIR/src/freedreno/vulkan/"*.json dist/turnip-arm64-v8a-$KMD/ || true
          cp VERSION dist/turnip-arm64-v8a-$KMD/
          git rev-parse --short HEAD > dist/turnip-arm64-v8a-$KMD/commit.txt
          meson introspect "$BUILD_DIR" --buildoptions | grep -E "vulkan-drivers|freedreno-kmds|platforms|buildtype" > dist/turnip-arm64-v8a-$KMD/buildoptions.txt || true
          (cd dist && zip -r ../turnip-arm64-v8a-$KMD.zip turnip-arm64-v8a-$KMD)
          ls -lh turnip-arm64-v8a-$KMD.zip
          unzip -l turnip-arm64-v8a-$KMD.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-arm64-v8a-${{ matrix.kmd }}
          path: turnip-arm64-v8a-${{ matrix.kmd }}.zip
          retention-days: 14
      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.kmd }}
          path: ${{ env.BUILD_DIR }}/meson-logs/
          retention-days: 5
